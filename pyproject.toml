[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof-person1-engine"
version = "0.4.0"
requires-python = ">=3.11"
description = "PatchProof evidence-backed dependency maintenance engine and QA tests"
dependencies = ["packaging>=23.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["patchproof", "patchproof.ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
